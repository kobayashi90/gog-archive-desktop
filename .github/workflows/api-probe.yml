name: API probe (diagnostic, delete after use)
on: [push]
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: DNS
        run: |
          getent ahosts gog.squid.wtf || echo "DNS FAILED"
          getent hosts gog.squid.wtf || true
      - name: curl with app UA
        run: |
          curl -4 -sS -m 15 -A 'gog-archive/1.0' -o /tmp/body -w 'curl(-4, appUA): HTTP %{http_code} in %{time_total}s (IP %{remote_ip})\n' 'https://gog.squid.wtf/api/games?page=1&per_page=1' || echo "curl -4 failed rc=$?"
          head -c 200 /tmp/body; echo
      - name: curl default UA
        run: |
          curl -4 -sS -m 15 -o /dev/null -w 'curl(-4, curlUA): HTTP %{http_code} in %{time_total}s\n' 'https://gog.squid.wtf/api/games?page=1&per_page=1' || echo "curl -4 defaultUA failed rc=$?"
      - name: IPv6 route
        run: |
          curl -6 -sS -m 8 -o /dev/null -w 'curl(-6): HTTP %{http_code}\n' 'https://gog.squid.wtf/api/games?page=1&per_page=1' || echo "curl -6 failed rc=$? (expected if no IPv6)"
      - name: Node fetch (undici, like Electron main)
        run: |
          node --version || echo "no node in PATH"
          node -e "
            const t = Date.now();
            fetch('https://gog.squid.wtf/api/games?page=1&per_page=1', { headers: { 'User-Agent': 'gog-archive/1.0' }, signal: AbortSignal.timeout(30000) })
              .then(async r => { console.log('nodefetch: HTTP', r.status, 'in', Date.now()-t, 'ms'); const b = await r.text(); console.log('body[0:120]:', b.slice(0,120)); })
              .catch(e => { console.log('nodefetch FAIL:', e.name, e.message, 'cause:', e.cause && (e.cause.code || e.cause.message)); process.exit(1); });
          " || echo "node fetch failed rc=$?"
