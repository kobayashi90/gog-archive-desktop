name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            build-args: '--bundles deb,rpm'
          - platform: windows-latest
            build-args: '--bundles msi,nsis'
          - platform: macos-latest
            build-args: '--bundles dmg --target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add x86_64 target (macOS universal binary)
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Install JS deps
        run: pnpm install

      - name: Build
        run: pnpm tauri build ${{ matrix.build-args }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          TAURI_SIGNING_IDENTITY: ""

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/release/gog-archive
            src-tauri/target/universal-apple-darwin/release/bundle/**/*
