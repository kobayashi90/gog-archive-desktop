name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      current_tag: ${{ steps.vars.outputs.tag }}
      current_name: ${{ steps.vars.outputs.name }}
      version_changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - id: vars
        run: |
          VER="$(grep '"version"' src-tauri/tauri.conf.json | sed 's/.*"\(.*\)".*/\1/')"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "name=GOG Archive Desktop v${VER}" >> "$GITHUB_OUTPUT"

      - id: check
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          if gh release view "$TAG" --json tagName 2>/dev/null | grep -q "$TAG"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: vars
        run: |
          echo "tag=${{ needs.check-version.outputs.current_tag }}" >> "$GITHUB_OUTPUT"
          echo "name=${{ needs.check-version.outputs.current_name }}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          PREV_TAG="$(git tag -l 'v*' --sort=-creatordate | sed -n '2p' || true)"
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG"..HEAD --oneline --no-decorate > /tmp/CHANGELOG.md
          else
            git log --oneline --no-decorate -20 > /tmp/CHANGELOG.md
          fi

      - name: Create lightweight tag
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git tag "${{ steps.vars.outputs.tag }}" "${{ github.sha }}"
          git push origin "${{ steps.vars.outputs.tag }}"

      - name: Create draft release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.name }}
          body_path: /tmp/CHANGELOG.md
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [check-version, create-release]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            build-args: '--bundles deb,rpm,appimage'
            artifact-patterns: |
              src-tauri/target/release/gog-archive
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: windows-latest
            build-args: '--bundles msi,nsis'
            artifact-patterns: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-latest
            build-args: '--bundles dmg --target universal-apple-darwin'
            artifact-patterns: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add x86_64 target (macOS universal binary)
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Install JS deps
        run: pnpm install

      - name: Build
        run: pnpm tauri build ${{ matrix.build-args }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          TAURI_SIGNING_IDENTITY: ""

      - name: Upload to release
        if: needs.check-version.outputs.version_changed == 'true'
        uses: softprops/action-gh-release@v3.0.1
        with:
          files: ${{ matrix.artifact-patterns }}
          tag_name: ${{ needs.check-version.outputs.current_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
