name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify version matches tag
        run: |
          SOURCE_VER="$(grep '"version"' src-tauri/tauri.conf.json | sed 's/.*"\(.*\)".*/\1/')"
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$SOURCE_VER" != "$TAG_VER" ]; then
            echo "ERROR: tauri.conf.json version ($SOURCE_VER) doesn't match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Delete existing release (clean slate)
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = releases.find(r => r.tag_name === context.ref.replace('refs/tags/', ''));
            if (existing) {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.id,
              });
              console.log('Deleted existing release: ' + existing.tag_name);
            }

      - id: create
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 'GOG Archive Desktop ${{ github.ref_name }}'
          body: ''
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            build-args: '--bundles deb,rpm,appimage'
            artifact-patterns: |
              src-tauri/target/release/gog-archive
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: windows-latest
            build-args: '--bundles msi,nsis'
            artifact-patterns: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Install JS deps
        run: pnpm install

      - name: Build
        run: pnpm tauri build ${{ matrix.build-args }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Upload artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact-patterns }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
