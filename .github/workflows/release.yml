name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      current_tag: ${{ steps.vars.outputs.tag }}
      current_name: ${{ steps.vars.outputs.name }}
      version_changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - id: vars
        run: |
          VER="$(grep '"version"' package.json | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "name=GOG Archive Desktop v${VER}" >> "$GITHUB_OUTPUT"

      - id: check
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          if gh release view "$TAG" --json tagName 2>/dev/null | grep -q "$TAG"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: vars
        run: |
          echo "tag=${{ needs.check-version.outputs.current_tag }}" >> "$GITHUB_OUTPUT"
          echo "name=${{ needs.check-version.outputs.current_name }}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          # Skip the current tag (present on re-runs); on a first run it does
          # not exist yet, so the newest remaining tag is the previous release.
          PREV_TAG="$(git tag -l 'v*' --sort=-creatordate | grep -vx "$TAG" | head -1 || true)"
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG"..HEAD --oneline --no-decorate > /tmp/CHANGELOG.md
          else
            git log --oneline --no-decorate -20 > /tmp/CHANGELOG.md
          fi

      - name: Create lightweight tag
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git tag "${{ steps.vars.outputs.tag }}" "${{ github.sha }}"
          git push origin "${{ steps.vars.outputs.tag }}"

      - name: Create draft release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.name }}
          body_path: /tmp/CHANGELOG.md
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [check-version, create-release]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            build-args: '--linux'
            artifact-patterns: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
          - platform: windows-latest
            build-args: '--win'
            artifact-patterns: |
              release/*.exe
          - platform: macos-latest
            build-args: '--mac'
            artifact-patterns: |
              release/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Linux packaging tools
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libfuse2

      - name: Install JS deps
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      # Targets live in package.json "build" (AppImage/deb/rpm, nsis,
      # dmg-universal); the flag selects the platform. npmRebuild is off and
      # there are no native deps, so no toolchains are needed beyond rpm/fuse.
      - name: Package
        run: pnpm exec electron-builder ${{ matrix.build-args }} --publish never
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Only a draft release collects artifacts — a fresh one from
      # create-release, or a partial one left by a failed run. A published
      # release must never be re-drafted by a later push to main, so gate on
      # the actual release state instead of version_changed (which is false
      # for exactly the retry case this needs to serve).
      - name: Upload to release
        shell: bash # gh + POSIX syntax on the Windows runner too
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check-version.outputs.current_tag }}"
          if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "Release $TAG is already published; not touching it."
            exit 0
          fi
          shopt -s nullglob
          FILES=(${{ matrix.artifact-patterns }})
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No artifacts matched the pattern for this platform."
            exit 1
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber
