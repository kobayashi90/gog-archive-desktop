allowBuilds:
  esbuild: true
  electron-winstaller: false
  # optional natives — all have pure-JS fallbacks, e2e verified without them
  bufferutil: false      # ws speedup
  utf-8-validate: false  # ws speedup
  ip-set: false          # tracker peer-set speedup
  node-datachannel: false # WebRTC (unused: e2e seeders are TCP/tracker)
  utp-native: false      # webtorrent UDP (TCP fallback works)
